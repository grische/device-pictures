---
name: Generate Images

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
  workflow_call:

jobs:
  conversion:
    name: Generate Images
    runs-on: ubuntu-latest
    # Patched Inkscape (no headless GtkRecentManager warning), built and
    # published from github.com/grische/inkscape. The image must be public.
    # See https://gitlab.com/inkscape/inkscape/-/work_items/5419
    container:
      image: ghcr.io/grische/inkscape:1.4.2-headless
    steps:
      - uses: actions/checkout@v6

      - name: install dependencies
        run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends imagemagick libimage-exiftool-perl

      - name: convert images
        run: |
            ./conversion-script.sh

      - name: package images
        shell: bash
        run: |
            # The tar is required to preserve symlinks
            tar cvf device-pictures-jpg.tar README.md pictures-jpg/
            tar cvf device-pictures-png.tar README.md pictures-png/

      - name: upload JPG archive
        uses: actions/upload-artifact@v7
        with:
          name: device-pictures-jpg.tar
          if-no-files-found: error
          path: device-pictures-jpg.tar

      - name: upload PNG archive
        uses: actions/upload-artifact@v7
        with:
          name: device-pictures-png.tar
          if-no-files-found: error
          path: device-pictures-png.tar
